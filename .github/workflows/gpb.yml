name: GPB APK Tracker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 3 * * 1"  # раз в неделю (понедельник 03:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file

      # ---------------------------
      - name: Download APK
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -o app.apk \
            https://static.online.gpb.ru/media/mobile/apk/new_version/android_inapp/android_inapp.apk

      # ---------------------------
      - name: Validate APK
        run: |
          file app.apk
          file app.apk | grep -Eq "Zip archive|Android package" || (echo "Not a valid APK" && exit 1)

      # ---------------------------
      - name: Calculate hash
        run: sha256sum app.apk | awk '{print $1}' > new_hash.txt

      # ---------------------------
      - name: Load old hash
        id: old
        run: |
          if [ -f hash.txt ]; then
            echo "old=$(cat hash.txt)" >> $GITHUB_OUTPUT
          else
            echo "old=none" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      - name: Load new hash
        id: new
        run: echo "new=$(cat new_hash.txt)" >> $GITHUB_OUTPUT

      # ---------------------------
      - name: Compare hashes
        id: compare
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "update=false" >> $GITHUB_OUTPUT
          else
            echo "update=true" >> $GITHUB_OUTPUT
          fi
        env:
          OLD_HASH: ${{ steps.old.outputs.old }}
          NEW_HASH: ${{ steps.new.outputs.new }}

      # ---------------------------
      - name: Save new hash
        if: steps.compare.outputs.update == 'true' || steps.old.outputs.old == 'none'
        run: mv new_hash.txt hash.txt

      # ---------------------------
      - name: Commit changes
        if: steps.compare.outputs.update == 'true'
        run: |
          git config user.name "gpb-bot"
          git config user.email "gpb@example.com"
          git add hash.txt
          git commit -m "New APK detected" || echo "No changes"
          git push

      # ---------------------------
      - name: Create Release
        if: steps.compare.outputs.update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gpb-${{ github.run_id }}
          name: GPB update
          body: |
            New APK detected.

            SHA256:
            ${{ steps.new.outputs.new }}
          files: app.apk

      # ---------------------------
      - name: Debug result
        run: echo "Update = ${{ steps.compare.outputs.update }}"
