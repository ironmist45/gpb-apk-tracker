name: GPB APK Check (Lite Visible)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner

      # ---------------------------
      - name: Download APK
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            -H "User-Agent: Mozilla/5.0" \
            -o app.apk \
            https://static.online.gpb.ru/media/mobile/apk/new_version/android_inapp/android_inapp.apk

      # ---------------------------
      - name: Extract certificate
        id: cert
        run: |
          apksigner verify --print-certs app.apk \
            | grep 'Signer #1 certificate SHA-256 digest:' \
            | awk '{print $NF}' > cert.txt
          echo "cert=$(cat cert.txt)" >> $GITHUB_OUTPUT

      # ---------------------------
      - name: Load old certificate
        id: oldcert
        run: |
          if [ -f cert_saved.txt ]; then
            echo "oldcert=$(cat cert_saved.txt)" >> $GITHUB_OUTPUT
          else
            echo "oldcert=none" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      - name: Check certificate
        run: |
          OLD=$(echo "$OLD_CERT" | tr -d '\n')
          NEW=$(echo "$CERT" | tr -d '\n')

          if [ "$OLD" != "none" ] && [ "$OLD" != "$NEW" ]; then
            echo "ERROR: Certificate mismatch!"
            exit 1
          fi
        env:
          OLD_CERT: ${{ steps.oldcert.outputs.oldcert }}
          CERT: ${{ steps.cert.outputs.cert }}

      # ---------------------------
      - name: Save certificate (first run)
        if: steps.oldcert.outputs.oldcert == 'none'
        run: mv cert.txt cert_saved.txt

      # ---------------------------
      - name: Calculate hash
        run: sha256sum app.apk | awk '{print $1}' > new_hash.txt

      # ---------------------------
      - name: Load old hash
        id: old
        run: |
          if [ -f hash.txt ]; then
            echo "old=$(cat hash.txt)" >> $GITHUB_OUTPUT
          else
            echo "old=none" >> $GITHUB_OUTPUT
          fi

      # ---------------------------
      - name: Load new hash
        id: new
        run: echo "new=$(cat new_hash.txt)" >> $GITHUB_OUTPUT

      # ---------------------------
      - name: Compare hashes
        id: compare
        run: |
          if [ "$OLD_HASH" = "$NEW_HASH" ]; then
            echo "update=false" >> $GITHUB_OUTPUT
          else
            echo "update=true" >> $GITHUB_OUTPUT
          fi
        env:
          OLD_HASH: ${{ steps.old.outputs.old }}
          NEW_HASH: ${{ steps.new.outputs.new }}

      # ---------------------------
      - name: Save new hash if changed
        if: steps.compare.outputs.update == 'true' || steps.old.outputs.old == 'none'
        run: mv new_hash.txt hash.txt

      # ---------------------------
      - name: Commit changes (hash + cert)
        if: steps.compare.outputs.update == 'true' || steps.oldcert.outputs.oldcert == 'none'
        run: |
          git config user.name "gpb-bot"
          git config user.email "gpb@example.com"
          git add hash.txt cert_saved.txt
          git commit -m "Update APK hash" || echo "No changes"
          git push

      # ---------------------------
      - name: Result
        run: echo "Update = ${{ steps.compare.outputs.update }}"
